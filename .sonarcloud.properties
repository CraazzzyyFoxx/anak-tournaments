# SonarCloud analysis scope for anak-tournaments (backend/ Python, frontend/ Next.js+TS, gateway/ Go).
#
# Two goals:
#   1. Keep non-source artifacts out of the analysis, so issues raised are actually actionable.
#   2. Classify test code as tests, so test-only patterns are not judged by production rules.

# --- Excluded from analysis -------------------------------------------------
#
# frontend/public/**
#   Static, published assets — not maintained source. Notably
#   frontend/public/docs/design-book.html is a generated documentation artifact;
#   Sonar reported Web:InputWithoutLabelCheck against it, which cannot be fixed
#   in the file because the file is output, not input.
#
# backend/migrations/versions/**
#   Alembic revisions are immutable historical records: once applied, they are
#   never refactored, because editing them rewrites migration history and breaks
#   the revision chain for every existing database. Sonar raises dozens of
#   python:S1192 (duplicated string literals) here that are physically
#   unfixable, drowning out real findings.
#
# node_modules, .venv — third-party dependency code; not ours to fix.
# __pycache__, .mypy_cache, .pytest_cache, .ruff_cache — tool caches.
# dist, build, .next — compiled/generated output; fix the source instead.
sonar.exclusions=frontend/public/**,**/node_modules/**,**/.venv/**,**/__pycache__/**,**/.mypy_cache/**,**/.pytest_cache/**,**/.ruff_cache/**,**/dist/**,**/build/**,**/.next/**,backend/migrations/versions/**

# --- Classified as test code ------------------------------------------------
#
# Analyzed, but under test-appropriate rules: assertions, fixtures and
# deliberate duplication in tests are intentional, not defects.
# Covers all three stacks: pytest (test_*.py), Vitest (*.test.ts/tsx), Go (*_test.go).
sonar.test.inclusions=**/tests/**,**/test_*.py,**/*.test.ts,**/*.test.tsx,**/*_test.go
