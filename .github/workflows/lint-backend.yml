name: Lint Backend

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff lint + format check
        run: uv run bash scripts/lint.sh
        working-directory: backend
      # The OpenAPI manifest the gateway embeds is hand-committed, exported from
      # the services' Pydantic models. Nothing forced the two to agree, and the
      # manifest has silently drifted before (+724/-175), leaving the public docs
      # advertising a contract the services no longer implement. ~10s.
      - name: OpenAPI manifest is up to date
        run: bash scripts/export_openapi_schemas.sh --check
        working-directory: backend
