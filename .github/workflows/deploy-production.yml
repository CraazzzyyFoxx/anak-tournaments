name: Deploy to Production

on:
  release:
    types:
      - published

# Nothing gated this before: publishing a release built and started the whole
# stack straight from the tag, with no lint, no tests, and no proof the frontend
# or the gateway even compiled. Each gate below CALLS the workflow a PR already
# runs (workflow_call), so a release is held to exactly the same bar and there is
# no second copy of those commands to drift.
#
# They run in parallel; `deploy` needs all four, so a single red gate leaves
# production untouched.
jobs:
  gate-lint-backend:
    uses: ./.github/workflows/lint-backend.yml

  gate-test-backend:
    uses: ./.github/workflows/test-backend.yml
    secrets: inherit

  gate-ci-frontend:
    uses: ./.github/workflows/ci-frontend.yml

  gate-ci-gateway:
    uses: ./.github/workflows/ci-gateway.yml

  deploy:
    needs:
      - gate-lint-backend
      - gate-test-backend
      - gate-ci-frontend
      - gate-ci-gateway
    runs-on:
      - self-hosted
      - production
    env:
      ENVIRONMENT: production
      APP_PORT: ${{ secrets.APP_PORT }}
      TRAEFIK_PORT: ${{ secrets.TRAEFIK_PORT }}
      USERNAME: ${{ secrets.USERNAME }}
      HASHED_PASSWORD: ${{ secrets.HASHED_PASSWORD }}

      NEXT_API_URL: ${{ secrets.NEXT_API_URL }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CACHE_POLICY: ${{ secrets.NEXT_PUBLIC_CACHE_POLICY }}

      PROJECT_URL: ${{ secrets.PROJECT_URL }}

      REDIS_URL: ${{ secrets.REDIS_URL }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}

      SUPERUSER_EMAIL: ${{ secrets.SUPERUSER_EMAIL }}
      SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}
      ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}

      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}

      CHALLONGE_API_KEY: ${{ secrets.CHALLONGE_API_KEY }}
      CHALLONGE_USERNAME: ${{ secrets.CHALLONGE_USERNAME }}

      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}


    steps:
      # checkout v5+ runs on Node 24 and needs a runner >= v2.327.1. This job is
      # the only one on the self-hosted 'production' runner, so bumping this pin
      # means checking that runner's version first — GitHub-hosted runners are
      # always current, a self-hosted one is not.
      - name: Checkout
        uses: actions/checkout@v6
      # Self-hosted runner shares the 15G prod box. Unbounded BuildKit cache
      # grew to 180G and the box swapped; keep 20G of recent layers.
      - name: Cap BuildKit cache
        run: docker builder prune --reserved-space 20GB -f > /tmp/owt-builder-prune.log 2>&1
      - run: docker compose -f docker-compose.production.yml --project-name owt build
      # --remove-orphans drops retired containers so nginx can bind APP_PORT.
      # PROD_SIZE=small: this 15G box is shared; bump to medium/large for events.
      - run: make prod-up PROD_SIZE=small
