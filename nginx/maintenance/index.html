<!doctype html>
<!-- Served by nginx with a 503 while nginx/maintenance/on exists (see nginx.conf,
     "Maintenance mode"). Self-contained: during maintenance nothing else on the
     origin answers, /_next included. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- Re-reads the ETA and, once maintenance is off, lands on the real page. -->
<meta http-equiv="refresh" content="60">
<title>Технические работы · Maintenance</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: hsl(220 21% 5%);
    color: hsl(214 33% 96%);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: min(34rem, calc(100% - 2rem));
    box-sizing: border-box;
    padding: 2rem;
    background: hsl(220 22% 8%);
    border: 1px solid hsl(219 19% 15%);
    border-radius: 12px;
  }
  h1 { margin: 0 0 .5rem; font-size: 1.375rem; line-height: 1.25; text-wrap: balance; }
  p { margin: 0 0 .5rem; color: hsl(212 13% 65%); }
  .eta { color: hsl(214 33% 96%); font-variant-numeric: tabular-nums; }
  hr { border: 0; border-top: 1px solid hsl(219 19% 15%); margin: 1.5rem 0; }
</style>
</head>
<body>
<main>
  <section>
    <h1>Идут технические работы</h1>
    <p>Обновляем сайт и базу данных. Страница сама откроет сайт, когда мы закончим.</p>
    <p class="eta" id="eta-ru" hidden></p>
  </section>
  <hr>
  <section lang="en">
    <h1>Scheduled maintenance</h1>
    <p>We are upgrading the site and its database. This page opens the site on its own once we are done.</p>
    <p class="eta" id="eta-en" hidden></p>
  </section>
</main>
<script>
  (function () {
    var ru = document.getElementById("eta-ru");
    var en = document.getElementById("eta-en");
    var until;

    function span(min, h, m) {
      var hours = Math.floor(min / 60), mins = min % 60;
      return [hours ? hours + "\u00a0" + h : "", mins ? mins + "\u00a0" + m : ""].join(" ").trim();
    }

    function render() {
      var left = Math.ceil((until - Date.now()) / 60000);
      if (left > 0) {
        var msk = until.toLocaleTimeString("ru-RU", { timeZone: "Europe/Moscow", hour: "2-digit", minute: "2-digit" });
        var local = until.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZoneName: "short" });
        ru.textContent = "Планируем закончить к " + msk + " МСК, осталось примерно " + span(left, "ч", "мин") + ".";
        en.textContent = "Expected back by " + local + ", about " + span(left, "h", "min") + " left.";
      } else {
        ru.textContent = "Работы занимают больше времени, чем планировали. Скоро обновим срок.";
        en.textContent = "This is taking longer than planned. We will update the estimate shortly.";
      }
      ru.hidden = en.hidden = false;
    }

    // { "until": "<ISO 8601>" }, written by `make maint-on` / `make maint-eta`.
    fetch("/__maintenance.json", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        var t = d && Date.parse(d.until);
        if (!t) return;
        until = new Date(t);
        render();
        setInterval(render, 15000);
      })
      .catch(function () {});
  })();
</script>
</body>
</html>
