uot;Lineup&quot;},&quot;showMetrics&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Balance&quot;}}\">\nconst CREST = [[2000, 1, \"Bronze\"], [2500, 5, \"Silver\"], [3000, 9, \"Gold\"], [3500, 13, \"Platinum\"], [9999, 17, \"Diamond\"]];\nconst ROLES = [\"tank\", \"dps\", \"support\"];\nconst RES = (id, fallback) => (window.__resources && window.__resources[id]) || fallback;\nconst ROLE_ICON = {\n  tank: RES(\"roleTank\", \"assets/roles/Tank.png\"),\n  dps: RES(\"roleDamage\", \"assets/roles/Damage.png\"),\n  support: RES(\"roleSupport\", \"assets/roles/Support.png\")\n};\nconst DIV_SRC = (n) => RES(\"div\" + n, \"assets/divisions/\" + n + \".png\");\nconst ROLE_LABEL = { tank: \"Tank\", dps: \"Damage\", support: \"Support\" };\nconst PER_PAGE = 30;\nconst POOL_TOTAL = 224;\n\nfunction crestFor(points) {\n  const hit = CREST.find((row) => points < row[0]) || CREST[CREST.length - 1];\n  return { src: DIV_SRC(hit[1]), label: hit[2] };\n}\n\nconst DIVISION_GRID = [\n  { division: 1, label: \"Bronze\", points: 1800 },\n  { division: 5, label: \"Silver\", points: 2300 },\n  { division: 9, label: \"Gold\", points: 2800 },\n  { division: 13, label: \"Platinum\", points: 3300 },\n  { division: 17, label: \"Diamond\", points: 3900 }\n];\n\nconst PLAYERS = [\n  { id: 1, name: \"Averet\", tag: \"#21358\", ranks: { tank: 4300, dps: 4100, support: null }, order: [\"tank\", \"dps\"], active: true },\n  { id: 2, name: \"Baida\", tag: \"#21855\", ranks: { tank: 3367, dps: 3200, support: 3100 }, order: [\"tank\", \"dps\", \"support\"], active: true },\n  { id: 3, name: \"Ando\", tag: \"#2734\", ranks: { tank: null, dps: 2900, support: 3100 }, order: [\"support\", \"dps\"], active: true },\n  { id: 4, name: \"AonamiPrime\", tag: \"#2832\", ranks: { tank: null, dps: null, support: 3000 }, order: [\"support\"], active: true },\n  { id: 5, name: \"b0n1k\", tag: \"#2831\", ranks: { tank: 2800, dps: 2967, support: null }, order: [\"tank\", \"dps\"], active: true },\n  { id: 6, name: \"Bagel\", tag: \"#21748\", ranks: { tank: null, dps: 4700, support: null }, order: [\"dps\"], active: true },\n  { id: 7, name: \"agoNy4\", tag: \"#2362\", ranks: { tank: null, dps: 2100, support: 2267 }, order: [\"support\", \"dps\"], active: true },\n  { id: 8, name: \"ANCKLAV\", tag: \"#2921\", ranks: { tank: 3300, dps: null, support: 3433 }, order: [\"support\", \"tank\"], active: true },\n  { id: 9, name: \"Andremorua\", tag: \"#2510\", ranks: { tank: null, dps: 3333, support: 3200 }, order: [\"dps\", \"support\"], active: true },\n  { id: 10, name: \"Askhay\", tag: \"#21578\", ranks: { tank: null, dps: 3600, support: null }, order: [\"dps\"], active: true },\n  { id: 11, name: \"Tolgrn\", tag: \"#21099\", ranks: { tank: 3450, dps: null, support: null }, order: [\"tank\"], active: false },\n  { id: 12, name: \"CeMaster\", tag: \"#21243\", ranks: { tank: null, dps: null, support: null }, order: [], active: false }\n];\n\nconst VARIANTS = [\n  { idx: 12, quality: \"1.84\", offRole: 1, optimal: true, a: [[2, \"tank\"], [5, \"dps\"], [6, \"dps\"], [3, \"support\"], [4, \"support\"]], b: [[1, \"tank\"], [9, \"dps\"], [10, \"dps\"], [7, \"support\"], [8, \"support\"]] },\n  { idx: 13, quality: \"1.91\", offRole: 2, optimal: false, a: [[1, \"tank\"], [6, \"dps\"], [9, \"dps\"], [4, \"support\"], [7, \"support\"]], b: [[2, \"tank\"], [5, \"dps\"], [10, \"dps\"], [3, \"support\"], [8, \"support\"]] },\n  { idx: 14, quality: \"2.07\", offRole: 1, optimal: true, a: [[2, \"tank\"], [10, \"dps\"], [6, \"dps\"], [8, \"support\"], [7, \"support\"]], b: [[1, \"tank\"], [5, \"dps\"], [9, \"dps\"], [3, \"support\"], [4, \"support\"]] }\n];\n\n/** Workspace roster beyond the mix — 224 rows, generated deterministically so paging is stable. */\nconst POOL_NAMES = [\"ANOD\", \"Baljaga\", \"Basis\", \"BlackRat\", \"Buran\", \"ByeBye\", \"CABY\", \"Carnivorous\", \"cerisee\", \"DemonDimon\",\n  \"marmeladka\", \"Korsner\", \"LookAtMyDuck\", \"shibainu\", \"rybr0n\", \"vac3x\", \"hzhz\", \"karin\", \"ToR\", \"Walarus\",\n  \"nova\", \"phoenix\", \"VicExtreme\", \"dasha21cm\", \"kars\", \"GasterVoice\", \"DiscoMan\", \"svevoloch\", \"myrka\", \"Хлороформ\",\n  \"qyryalien\", \"CheRnU9h\", \"thesevenast\", \"Tolgrn2\", \"kirbi\", \"nyaanya\"];\n\nconst POOL = (() => {\n  const rows = [];\n  for (let i = 0; i < POOL_TOTAL - PLAYERS.length; i += 1) {\n    const base = POOL_NAMES[i % POOL_NAMES.length];\n    const cycle = Math.floor(i / POOL_NAMES.length);\n    const seed = (i * 37) % 100;\n    const ranks = { tank: null, dps: null, support: null };\n    if (seed % 7 !== 0) {\n      const roleSet = seed % 3 === 0 ? [\"tank\", \"dps\"] : seed % 3 === 1 ? [\"dps\", \"support\"] : [\"support\"];\n      roleSet.forEach((role, at) => {\n        ranks[role] = 1900 + ((seed * 31 + at * 210) % 2600);\n      });\n    }\n    const order = ROLES.filter((role) => ranks[role] != null);\n    rows.push({\n      id: 1000 + i,\n      name: cycle === 0 ? base : base + (cycle + 1),\n      tag: \"#\" + (2100 + ((i * 173) % 21000)),\n      ranks,\n      order\n    });\n  }\n  return rows;\n})();\n\nclass Component extends DCLogic {\n  state = {\n    screen: \"mix\",\n    poolOpen: false,\n    addOpen: false,\n    onlyMix: false,\n    poolQuery: \"\",\n    poolPage: 1,\n    variant: 0,\n    result: null,\n    dragId: null,\n    sheetId: null,\n    pickerOpen: false,\n    toast: \"\",\n    players: PLAYERS.map((p) => ({ ...p, ranks: { ...p.ranks }, order: [...p.order], rankValue: null, team: null, slot: null }))\n  };\n\n  componentDidMount() {\n    this.applyVariant(0);\n    this._key = (event) => {\n      if (event.key === \"Escape\") {\n        if (this.state.pickerOpen) this.setState({ pickerOpen: false });\n        else if (this.state.sheetId != null) this.setState({ sheetId: null });\n        else if (this.state.poolOpen) this.setState({ poolOpen: false });\n        else if (this.state.screen === \"board\") this.setState({ screen: \"mix\" });\n      }\n      if (this.state.screen === \"board\" && event.key === \"ArrowRight\") this.step(1);\n      if (this.state.screen === \"board\" && event.key === \"ArrowLeft\") this.step(-1);\n    };\n    window.addEventListener(\"keydown\", this._key);\n    if (this.props.startScreen && this.props.startScreen !== \"mix\") this.setState({ screen: this.props.startScreen });\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener(\"keydown\", this._key);\n  }\n\n  applyVariant(index) {\n    const v = VARIANTS[index];\n    this.setState((s) => ({\n      variant: index,\n      result: null,\n      players: s.players.map((p) => {\n        const inA = v.a.find((row) => row[0] === p.id);\n        const inB = v.b.find((row) => row[0] === p.id);\n        if (inA) return { ...p, team: 1, slot: inA[1] };\n        if (inB) return { ...p, team: 2, slot: inB[1] };\n        return { ...p, team: null, slot: null };\n      })\n    }));\n  }\n\n  step(delta) {\n    this.applyVariant((this.state.variant + delta + VARIANTS.length) % VARIANTS.length);\n  }\n\n  swap(aId, bId) {\n    if (aId == null || bId == null || aId === bId) return;\n    this.setState((s) => {\n      const a = s.players.find((p) => p.id === aId);\n      const b = s.players.find((p) => p.id === bId);\n      if (!a || !b) return null;\n      return {\n        dragId: null,\n        players: s.players.map((p) => {\n          if (p.id === aId) return { ...p, team: b.team, slot: b.slot };\n          if (p.id === bId) return { ...p, team: a.team, slot: a.slot };\n          return p;\n        })\n      };\n    });\n  }\n\n  effective(p) {\n    if (p.rankValue != null) return p.rankValue;\n    const values = p.order.map((role) => p.ranks[role]).filter((v) => v != null);\n    if (values.length === 0) return null;\n    return Math.round(values.reduce((sum, v) => sum + v, 0) / values.length);\n  }\n\n  slotPoints(p) {\n    if (p.rankValue != null) return p.rankValue;\n    return p.ranks[p.slot] != null ? p.ranks[p.slot] : this.effective(p);\n  }\n\n  teamRows(teamIndex) {\n    const rank = { tank: 0, dps: 1, support: 2 };\n    return this.state.players\n      .filter((p) => p.team === teamIndex)\n      .sort((a, b) => rank[a.slot] - rank[b.slot] || a.name.localeCompare(b.name))\n      .map((p) => {\n        const points = this.slotPoints(p);\n        const crest = crestFor(points || 0);\n        const dragging = this.state.dragId === p.id;\n        return {\n          id: p.id,\n          name: p.name,\n          tag: p.tag,\n          points: points == null ? \"—\" : points,\n          crest: crest.src,\n          crestBg: \"url(\" + crest.src + \")\",\n          divLabel: crest.label,\n          roleIcon: ROLE_ICON[p.slot],\n          roleIconBg: \"url(\" + ROLE_ICON[p.slot] + \")\",\n          slotLabel: ROLE_LABEL[p.slot],\n          offRole: p.order.length > 0 && p.order[0] !== p.slot,\n          rowBg: dragging ? \"var(--aqt-overlay-3)\" : \"var(--aqt-overlay-1)\",\n          boardBg: dragging ? \"var(--aqt-card-2)\" : \"var(--aqt-card)\",\n          rowBorder: dragging ? \"var(--aqt-teal)\" : \"var(--aqt-border)\",\n          onDragStart: () => this.setState({ dragId: p.id }),\n          onDragOver: (event) => event.preventDefault(),\n          onDrop: (event) => { event.preventDefault(); this.swap(this.state.dragId, p.id); },\n          onDragEnd: () => this.setState({ dragId: null })\n        };\n      });\n  }\n\n  average(teamIndex) {\n    const values = this.state.players.filter((p) => p.team === teamIndex).map((p) => this.slotPoints(p)).filter((v) => v != null);\n    if (values.length === 0) return null;\n    return Math.round(values.reduce((sum, v) => sum + v, 0) / values.length);\n  }\n\n  lineupRow(p) {\n    const points = this.effective(p);\n    const crest = crestFor(points || 0);\n    const chip = (role) => {\n      const at = p.order.indexOf(role);\n      const rank = p.ranks[role];\n      return {\n        pri: at === -1 ? \"\" : String(at + 1),\n        opacity: at === -1 ? \"0.26\" : \"1\",\n        on: at !== -1,\n        label: ROLE_LABEL[role] + \" for \" + p.name + (at === -1\n          ? \" — off\"\n          : \", priority \" + (at + 1) + (rank == null ? \", no rank\" : \", \" + rank + \" points\"))\n      };\n    };\n    const tank = chip(\"tank\");\n    const dps = chip(\"dps\");\n    const support = chip(\"support\");\n    return {\n      id: p.id,\n      name: p.name,\n      tag: p.tag,\n      active: p.active,\n      points: points == null ? \"—\" : points,\n      crest: crest.src,\n      crestBg: \"url(\" + crest.src + \")\",\n      divLabel: crest.label,\n      tankPri: tank.pri, tankOpacity: tank.opacity, tankOn: tank.on,\n      dpsPri: dps.pri, dpsOpacity: dps.opacity, dpsOn: dps.on,\n      supportPri: support.pri, supportOpacity: support.opacity, supportOn: support.on,\n      overrideMark: p.rankValue == null ? \"\" : \"*\",\n      includeLabel: \"Include \" + p.name + p.tag + \" in the balance\",\n      pointsTitle: p.rankValue == null ? \"Workspace ranks\" : \"Mix rank override\",\n      rolesLabel: \"Roles for \" + p.name + \" — \" + (p.order.length === 0 ? \"none selected\" : p.order.map((role) => ROLE_LABEL[role]).join(\", \")),\n      benchNote: p.order.length === 0 ? \"no ranked role\" : \"benched\",\n      removeLabel: \"Remove \" + p.name + \" from this mix\",\n      settingsLabel: \"Advanced settings for \" + p.name,\n      rowLabel: \"Advanced settings for \" + p.name + p.tag,\n      stop: (event) => event.stopPropagation(),\n      openSheet: () => this.setState({ sheetId: p.id }),\n      toggle: () => this.setState((s) => ({ players: s.players.map((row) => (row.id === p.id ? { ...row, active: !row.active } : row)) })),\n      remove: (event) => {\n        if (event && event.stopPropagation) event.stopPropagation();\n        this.setState((s) => ({ players: s.players.filter((row) => row.id !== p.id), toast: \"Removed \" + p.name + \" from the mix\" }));\n      },\n      openDrawer: () => this.setState({ sheetId: p.id })\n    };\n  }\n\n  moveRole(id, role, delta) {\n    this.setState((s) => ({\n      players: s.players.map((p) => {\n        if (p.id !== id) return p;\n        const from = p.order.indexOf(role);\n        const to = from + delta;\n        if (from === -1 || to < 0 || to >= p.order.length) return p;\n        const order = [...p.order];\n        order.splice(from, 1);\n        order.splice(to, 0, role);\n        return { ...p, order };\n      })\n    }));\n  }\n\n  sheetVals() {\n    const p = this.state.players.find((row) => row.id === this.state.sheetId);\n    if (!p) return null;\n    const ordered = [...p.order, ...ROLES.filter((role) => !p.order.includes(role))];\n    const override = p.rankValue ?? null;\n    const crest = override == null ? null : crestFor(override);\n    const ranked = p.order.filter((role) => p.ranks[role] != null).length;\n    const issue = p.order.length === 0\n      ? \"No roles selected — balance will reject this mix\"\n      : ranked === 0 ? \"No rank on any selected role — balance will reject this mix\" : null;\n    const label = p.name + p.tag;\n    return {\n      name: p.name,\n      tag: p.tag,\n      active: p.active,\n      includeLabel: \"Include \" + label + \" in the balance\",\n      toggleActive: () => this.setState((s) => ({ players: s.players.map((row) => (row.id === p.id ? { ...row, active: !row.active } : row)) })),\n      hasIssue: issue != null,\n      issue: issue ?? \"\",\n      roles: ordered.map((role) => {\n        const at = p.order.indexOf(role);\n        const on = at !== -1;\n        const rank = p.ranks[role];\n        const tint = role === \"tank\" ? \"209 82% 65%\" : role === \"dps\" ? \"337 81% 66%\" : \"150 57% 52%\";\n        return {\n          label: ROLE_LABEL[role],\n          on: on,\n          position: on ? String(at + 1) : \"–\",\n          tileBg: on ? \"hsl(\" + tint + \" / .16)\" : \"var(--aqt-overlay-3)\",\n          tileColor: on ? \"hsl(\" + tint + \")\" : \"var(--aqt-fg-faint)\",\n          iconBg: \"url(\" + ROLE_ICON[role] + \")\",\n          iconOpacity: on ? \"1\" : \"0.32\",\n          nameColor: on ? \"var(--aqt-fg)\" : \"var(--aqt-fg-dim)\",\n          rankText: rank == null ? \"No rank\" : rank + \" pts\",\n          switchLabel: ROLE_LABEL[role] + \" for \" + label,\n          border: on ? \"var(--aqt-border-2)\" : \"var(--aqt-border)\",\n          bg: on ? \"var(--aqt-overlay-2)\" : \"transparent\",\n          upColor: at > 0 ? \"var(--aqt-fg-muted)\" : \"var(--aqt-fg-faint)\",\n          downColor: on && at < p.order.length - 1 ? \"var(--aqt-fg-muted)\" : \"var(--aqt-fg-faint)\",\n          upLabel: \"Raise \" + ROLE_LABEL[role] + \" priority for \" + label,\n          downLabel: \"Lower \" + ROLE_LABEL[role] + \" priority for \" + label,\n          toggle: () => this.cycleRole(p.id, role),\n          up: () => this.moveRole(p.id, role, -1),\n          down: () => this.moveRole(p.id, role, 1)\n        };\n      }),\n      hasOverride: override != null,\n      noOverride: override == null,\n      overrideCrestBg: crest ? \"url(\" + crest.src + \")\" : \"none\",\n      overrideDivLabel: crest ? crest.label : \"\",\n      overrideCaption: override == null ? \"Using workspace ranks\" : override + \" pts for every role\",\n      pickerLabel: \"Mix rank for \" + label,\n      removeLabel: \"Remove \" + p.name + \" from this mix\",\n      remove: () => this.setState((s) => ({\n        players: s.players.filter((row) => row.id !== p.id),\n        sheetId: null,\n        toast: \"Removed \" + p.name + \" from the mix\"\n      }))\n    };\n  }\n\n  setOverride(points) {\n    this.setState((s) => ({\n      pickerOpen: false,\n      players: s.players.map((p) => (p.id === s.sheetId ? { ...p, rankValue: points } : p)),\n      toast: points == null ? \"Mix rank override cleared\" : \"Mix rank override set · \" + points\n    }));\n  }\n\n  cycleRole(id, role) {\n    this.setState((s) => ({\n      players: s.players.map((p) => {\n        if (p.id !== id) return p;\n        const order = p.order.includes(role) ? p.order.filter((r) => r !== role) : [...p.order, role];\n        return { ...p, order };\n      })\n    }));\n  }\n\n  supplyRows() {\n    const active = this.state.players.filter((p) => p.active);\n    return ROLES.map((role) => {\n      const supply = active.filter((p) => p.order.includes(role) && p.ranks[role] != null).length;\n      const need = role === \"tank\" ? 2 : 4;\n      const short = need - supply;\n      return {\n        role: ROLE_LABEL[role],\n        icon: ROLE_ICON[role],\n        iconBg: \"url(\" + ROLE_ICON[role] + \")\",\n        value: short > 0 ? supply + \" of \" + need + \" · short \" + short : supply + \" of \" + need,\n        color: short > 0 ? \"var(--aqt-amber)\" : \"hsl(150 57% 62%)\",\n        fill: Math.min(100, Math.round((supply / need) * 100)) + \"%\"\n      };\n    });\n  }\n\n  poolPage() {\n    const inMix = new Set(this.state.players.map((p) => p.id));\n    const query = this.state.poolQuery.trim().toLowerCase();\n    const all = [...this.state.players.map((p) => ({ ...p, mix: true })), ...POOL.map((p) => ({ ...p, mix: inMix.has(p.id) }))];\n    const filtered = all.filter((p) => {\n      if (query && !(p.name + p.tag).toLowerCase().includes(query)) return false;\n      if (this.state.onlyMix) return p.mix;\n      return true;\n    });\n    const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));\n    const page = Math.min(this.state.poolPage, totalPages);\n    const start = (page - 1) * PER_PAGE;\n    const rows = filtered.slice(start, start + PER_PAGE);\n    return { rows, total: filtered.length, page, totalPages, first: filtered.length === 0 ? 0 : start + 1, last: start + rows.length };\n  }\n\n  poolRow(p) {\n    return {\n      id: p.id,\n      name: p.name,\n      tag: p.tag,\n      mix: p.mix,\n      notInMix: !p.mix,\n      checkColor: p.mix ? \"var(--aqt-bg)\" : \"var(--aqt-fg-dim)\",\n      checkBg: p.mix ? \"var(--aqt-teal)\" : \"transparent\",\n      checkBorder: p.mix ? \"var(--aqt-teal)\" : \"var(--aqt-border-2)\",\n      actionTitle: p.mix ? \"Remove from this mix\" : \"Add to this mix\",\n      bg: p.mix ? \"hsl(172 70% 49% / .07)\" : \"var(--aqt-overlay-1)\",\n      border: p.mix ? \"hsl(172 70% 49% / .28)\" : \"var(--aqt-border)\",\n      rankCells: ROLES.map((role) => {\n        const value = p.ranks[role];\n        const crest = value == null ? null : crestFor(value);\n        return {\n          crest: crest ? crest.src : null,\n          crestBg: crest ? \"url(\" + crest.src + \")\" : \"none\",\n          divLabel: crest ? crest.label : \"\",\n          dash: value == null ? \"—\" : \"\",\n          title: value == null\n            ? ROLE_LABEL[role] + \" rank for \" + p.name + \" — not set\"\n            : ROLE_LABEL[role] + \" rank for \" + p.name + \" — \" + (crest ? crest.label : \"\") + \" · \" + value\n        };\n      }),\n      toggleMix: () => this.togglePool(p)\n    };\n  }\n\n  togglePool(entry) {\n    this.setState((s) => {\n      const exists = s.players.some((p) => p.id === entry.id);\n      if (exists) return { players: s.players.filter((p) => p.id !== entry.id), toast: \"Removed \" + entry.name };\n      const fresh = { id: entry.id, name: entry.name, tag: entry.tag, ranks: { ...entry.ranks }, order: [...entry.order], rankValue: null, active: true, team: null, slot: null };\n      return { players: [...s.players, fresh], toast: \"Added \" + entry.name + \" — press Balance teams to reslot\" };\n    });\n  }\n\n  resultStyle(kind, tone) {\n    if (this.state.result !== kind) return { bg: \"var(--aqt-overlay-1)\", border: \"var(--aqt-border)\", color: \"var(--aqt-fg-muted)\" };\n    return { bg: \"hsl(\" + tone + \" / .14)\", border: \"hsl(\" + tone + \" / .45)\", color: \"hsl(\" + tone + \")\" };\n  }\n\n  renderVals() {\n    const screen = this.state.screen;\n    const v = VARIANTS[this.state.variant];\n    const avg1 = this.average(1);\n    const avg2 = this.average(2);\n    const spread = avg1 != null && avg2 != null ? Math.abs(avg1 - avg2) : null;\n    const active = this.state.players.filter((p) => p.active);\n    const benched = this.state.players.filter((p) => !p.active);\n    const blocking = active.filter((p) => p.order.filter((role) => p.ranks[role] != null).length === 0);\n    const win1 = this.resultStyle(\"team1\", \"172 70% 49%\");\n    const win2 = this.resultStyle(\"team2\", \"36 88% 65%\");\n    const draw = this.resultStyle(\"draw\", \"213 9% 58%\");\n    const pool = this.poolPage();\n    const pageWindow = [];\n    for (let i = 1; i <= pool.totalPages && pageWindow.length < 6; i += 1) pageWindow.push(i);\n    const teamAvgs = [3376, 3358, 3341, 3330, 3318, 3299, 3271, 3248];\n    const offsets = [130, 60, -30, -60, -100];\n    const rosterNames = [\n      [\"Buran\", \"Bagel\", \"Ando\", \"cerisee\", \"ANCKLAV\"],\n      [\"Basis\", \"Askhay\", \"b0n1k\", \"ANCKLAV2\", \"cerisee2\"],\n      [\"marmeladka\", \"DemonDimon\", \"Askhay2\", \"AonamiPrime\", \"agoNy4\"],\n      [\"Averet\", \"Bagel2\", \"Andremorua\", \"CABY\", \"Korsner\"],\n      [\"Baida\", \"CABY2\", \"Basis2\", \"Korsner2\", \"AonamiPrime2\"],\n      [\"ByeBye\", \"Carnivorous\", \"ByeBye2\", \"agoNy42\", \"CABY3\"],\n      [\"Korsner3\", \"Baljaga\", \"marmeladka2\", \"Carnivorous2\", \"Basis3\"],\n      [\"b0n1k2\", \"BlackRat\", \"Buran2\", \"Ando2\", \"Baljaga2\"]\n    ];\n\n    return {\n      isMix: screen === \"mix\",\n      isTournament: screen === \"tournament\",\n      isBoard: screen === \"board\",\n      poolOpen: this.state.poolOpen,\n      goMix: () => this.setState({ screen: \"mix\" }),\n      goTournament: () => this.setState({ screen: \"tournament\" }),\n\n      mixStatus: this.state.result ? \"finished\" : \"live\",\n      mixMeta: \"Created 2d ago · host CraazzzyyFoxx · balanced \" + (this.state.result ? \"and closed\" : \"4 min ago\"),\n      lineupCaption: active.length + \" in the balance · \" + benched.length + \" benched\",\n      benchedCaption: \"Benched · \" + benched.length,\n      showBenchedSection: (this.props.showBenched ?? true) && benched.length > 0,\n      showSupply: this.props.showSupply ?? true,\n      showMetrics: this.props.showMetrics ?? true,\n      hasBlocking: blocking.length > 0,\n      blockingText: blocking.length === 1\n        ? blocking[0].name + \" has no ranked role — the balance will reject this mix.\"\n        : blocking.length + \" players have no ranked role — the balance will reject this mix.\",\n      activeRows: active.map((p) => this.lineupRow(p)),\n      benchedRows: benched.map((p) => this.lineupRow(p)),\n      supply: this.supplyRows(),\n\n      team1: this.teamRows(1),\n      team2: this.teamRows(2),\n      avg1: avg1 == null ? \"—\" : avg1,\n      avg2: avg2 == null ? \"—\" : avg2,\n      delta1: avg1 != null && avg2 != null ? (avg1 >= avg2 ? \"+\" + (avg1 - avg2) : \"−\" + (avg2 - avg1)) : \"\",\n      delta2: avg1 != null && avg2 != null ? (avg2 >= avg1 ? \"+\" + (avg2 - avg1) : \"−\" + (avg1 - avg2)) : \"\",\n      delta1Color: avg1 != null && avg2 != null && avg1 > avg2 ? \"var(--aqt-amber)\" : \"var(--aqt-fg-faint)\",\n      delta2Color: avg1 != null && avg2 != null && avg2 > avg1 ? \"var(--aqt-amber)\" : \"var(--aqt-fg-faint)\",\n\n      quality: v.quality,\n      stdDev: spread == null ? \"—\" : (spread / 2).toFixed(1),\n      spread: spread == null ? \"—\" : spread,\n      offRoleLabel: \"OFF-ROLE \" + v.offRole,\n      offRoleTitle: v.optimal\n        ? v.offRole + \" off-role assignments — structural minimum for this pool, no balancer can do better.\"\n        : v.offRole + \" off-role assignments — above the structural minimum for this pool.\",\n      variantLabel: v.idx + \" / 480\",\n      prevVariant: () => this.step(-1),\n      nextVariant: () => this.step(1),\n      runBalance: () => this.setState({ toast: \"Balanced · 480 variants in 2.1s\" }, () => this.step(1)),\n\n      openBoard: () => this.setState({ screen: \"board\" }),\n      closeBoard: () => this.setState({ screen: \"mix\" }),\n      boardEyebrow: \"TXAO · Thursday scrim #12 · balanced 4 min ago\",\n      boardHint: \"Drag a player onto another to swap · ← → for the next balance\",\n\n      winTeam1: () => this.setState({ result: \"team1\", toast: \"Result saved · Team 1 win\" }),\n      winTeam2: () => this.setState({ result: \"team2\", toast: \"Result saved · Team 2 win\" }),\n      drawResult: () => this.setState({ result: \"draw\", toast: \"Result saved · draw\" }),\n      finishMix: () => this.setState((s) => ({ result: s.result ?? \"draw\", toast: \"Mix finished — ranks written back to the workspace\" })),\n      resultNote: this.state.result ? \"Recorded — finishing the mix writes it to the workspace.\" : \"Ranks stay untouched until you record a result.\",\n      win1Bg: win1.bg, win1Border: win1.border, win1Color: win1.color,\n      win2Bg: win2.bg, win2Border: win2.border, win2Color: win2.color,\n      drawBg: draw.bg, drawBorder: draw.border, drawColor: draw.color,\n\n      copyImage: () => this.setState({ toast: \"Board copied to clipboard as PNG\" }),\n      copyTags: () => this.setState({ toast: \"Copied \" + active.length + \" BattleTags\" }),\n      toast: this.state.toast,\n      hasToast: this.state.toast !== \"\",\n\n      sheetOpen: this.state.sheetId != null,\n      pickerOpen: this.state.pickerOpen,\n      togglePicker: () => this.setState((s) => ({ pickerOpen: !s.pickerOpen })),\n      clearOverride: () => this.setOverride(null),\n      divisionGrid: DIVISION_GRID.map((tier) => {\n        const current = this.state.players.find((row) => row.id === this.state.sheetId);\n        const on = current != null && current.rankValue === tier.points;\n        return {\n          label: tier.label + \" · \" + tier.points + \" pts\",\n          points: tier.points,\n          crestBg: \"url(\" + DIV_SRC(tier.division) + \")\",\n          bg: on ? \"hsl(172 70% 49% / .14)\" : \"transparent\",\n          border: on ? \"hsl(172 70% 49% / .45)\" : \"var(--aqt-border)\",\n          pick: () => this.setOverride(tier.points)\n        };\n      }),\n      sheet: this.sheetVals() ?? { name: \"\", tag: \"\", active: false, includeLabel: \"\", hasIssue: false, issue: \"\", roles: [], hasOverride: false, noOverride: true, overrideCrestBg: \"none\", overrideDivLabel: \"\", overrideCaption: \"\", pickerLabel: \"\", removeLabel: \"\", remove: () => {}, toggleActive: () => {} },\n      closeSheet: () => this.setState({ sheetId: null, pickerOpen: false }),\n      openPool: () => this.setState({ poolOpen: true }),\n      closePool: () => this.setState({ poolOpen: false, addOpen: false }),\n      addOpen: this.state.addOpen,\n      toggleAdd: () => this.setState((s) => ({ addOpen: !s.addOpen })),\n      addByTag: () => this.setState({ toast: \"BattleTag saved to the workspace\" }),\n      poolQuery: this.state.poolQuery,\n      setPoolQuery: (value) => this.setState({ poolQuery: typeof value === \"string\" ? value : \"\", poolPage: 1 }),\n      poolCaption: POOL_TOTAL + \" players · ranks carry across every tournament in this workspace\",\n      mixCount: this.state.players.length,\n      onlyMixBg: this.state.onlyMix ? \"hsl(172 70% 49% / .12)\" : \"var(--aqt-overlay-1)\",\n      onlyMixBorder: this.state.onlyMix ? \"hsl(172 70% 49% / .4)\" : \"var(--aqt-border)\",\n      onlyMixColor: this.state.onlyMix ? \"var(--aqt-fg)\" : \"var(--aqt-fg-muted)\",\n      toggleOnlyMix: () => this.setState((s) => ({ onlyMix: !s.onlyMix, poolPage: 1 })),\n      rankColumns: ROLES.map((role) => ({ label: ROLE_LABEL[role], icon: ROLE_ICON[role], iconBg: \"url(\" + ROLE_ICON[role] + \")\" })),\n      poolRows: pool.rows.map((p) => this.poolRow(p)),\n      poolRange: pool.total === 0 ? \"0 players\" : pool.first + \"–\" + pool.last + \" of \" + pool.total,\n      poolPages: pageWindow.map((page) => ({\n        label: String(page),\n        go: () => this.setState({ poolPage: page }),\n        bg: page === pool.page ? \"hsl(172 70% 49% / .12)\" : \"transparent\",\n        border: page === pool.page ? \"hsl(172 70% 49% / .4)\" : \"var(--aqt-border)\",\n        color: page === pool.page ? \"var(--aqt-fg)\" : \"var(--aqt-fg-muted)\"\n      })),\n      poolPrev: () => this.setState((s) => ({ poolPage: Math.max(1, s.poolPage - 1) })),\n      poolNext: () => this.setState((s) => ({ poolPage: Math.min(pool.totalPages, s.poolPage + 1) })),\n\n      tankIconBg: \"url(\" + ROLE_ICON.tank + \")\",\n      damageIconBg: \"url(\" + ROLE_ICON.dps + \")\",\n      supportIconBg: \"url(\" + ROLE_ICON.support + \")\",\n      counters: [{ label: \"Players\", value: 224 }, { label: \"Registered\", value: 96 }, { label: \"Teams\", value: 8 }],\n      variantCards: [0, 1, 2, 3, 4, 5].map((i) => {\n        const item = VARIANTS[i % VARIANTS.length];\n        return {\n          label: \"Balance \" + (i + 1),\n          off: item.offRole,\n          offColor: item.optimal ? \"hsl(150 57% 68%)\" : \"var(--aqt-amber)\",\n          col: 0,\n          sd: (30 + i * 4.6).toFixed(1),\n          bg: i === 0 ? \"hsl(172 70% 49% / .1)\" : \"var(--aqt-overlay-1)\",\n          border: i === 0 ? \"hsl(172 70% 49% / .35)\" : \"var(--aqt-border)\",\n          select: () => this.setState({ toast: \"Loaded balance \" + (i + 1) + \" into the editor\" })\n        };\n      }),\n      distributionCaption: (() => {\n        const mean = teamAvgs.reduce((sum, x) => sum + x, 0) / teamAvgs.length;\n        const sigma = Math.sqrt(teamAvgs.reduce((sum, x) => sum + (x - mean) * (x - mean), 0) / teamAvgs.length);\n        return \"Avg \" + Math.round(mean) + \" · Spread \" + (Math.max(...teamAvgs) - Math.min(...teamAvgs))\n          + \" · Range \" + Math.min(...teamAvgs) + \"–\" + Math.max(...teamAvgs) + \" · σ \" + sigma.toFixed(1);\n      })(),\n      distributionPips: teamAvgs.map((avg, i) => ({\n        id: i + 1,\n        left: Math.round(((avg - 3248) / (3376 - 3248)) * 92) + 4 + \"%\",\n        title: \"Team \" + (i + 1) + \" — avg \" + avg\n      })),\n      tournamentTeams: teamAvgs.map((avg, i) => ({\n        name: \"Team \" + (i + 1),\n        avg: avg,\n        players: rosterNames[i].map((name, slot) => ({\n          role: ROLE_LABEL[slot === 0 ? \"tank\" : slot < 3 ? \"dps\" : \"support\"],\n          icon: ROLE_ICON[slot === 0 ? \"tank\" : slot < 3 ? \"dps\" : \"support\"],\n          iconBg: \"url(\" + ROLE_ICON[slot === 0 ? \"tank\" : slot < 3 ? \"dps\" : \"support\"] + \")\",\n          name: name,\n          points: avg + offsets[slot]\n        }))\n      })),\n      triage: [\n        { label: \"Unranked players\", value: 6, color: \"var(--aqt-amber)\" },\n        { label: \"No role selected\", value: 3, color: \"var(--aqt-amber)\" },\n        { label: \"Duplicate BattleTags\", value: 2, color: \"var(--aqt-rose)\" },\n        { label: \"Ready to balance\", value: 85, color: \"hsl(150 57% 68%)\" }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
